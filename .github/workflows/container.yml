name: Build container

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/southbaghq/kevin-slack

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # BuildKit does not retry Docker Hub oauth token fetches, so a single
      # auth.docker.io EOF fails the job. Retry the build-push step.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: build
        continue-on-error: true
        with: &build-push
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Wait before retrying image build
        if: steps.build.outcome == 'failure'
        run: sleep 15
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: build-retry
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        with: *build-push
      - name: Wait before final image build retry
        if: steps.build.outcome == 'failure' && steps.build-retry.outcome == 'failure'
        run: sleep 30
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: build-final
        if: steps.build.outcome == 'failure' && steps.build-retry.outcome == 'failure'
        continue-on-error: true
        with: *build-push
      - name: Fail if image build did not succeed
        if: always() && steps.build.outcome != 'success' && steps.build-retry.outcome != 'success' && steps.build-final.outcome != 'success'
        run: |
          echo "Container build failed after retries" >&2
          exit 1
